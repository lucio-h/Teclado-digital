<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teclado Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="title">KEY<span>BOARD</span></div>

  <div class="input-wrapper">
    <input type="text" id="display" placeholder="comece a digitar..." autocomplete="off" autofocus>
  </div>

  <div class="status-bar">
    <div class="status-pill" id="caps-status">CAPS</div>
    <div class="status-pill" id="shift-status">SHIFT</div>
  </div>

  <div class="keyboard" id="keyboard">

    <div class="row row-f">
      <button class="key-esc" data-key="Escape">Esc</button>
      <button class="key-fkey" data-key="F1">F1</button>
      <button class="key-fkey" data-key="F2">F2</button>
      <button class="key-fkey" data-key="F3">F3</button>
      <button class="key-fkey" data-key="F4">F4</button>
      <button class="key-fkey" data-key="F5">F5</button>
      <button class="key-fkey" data-key="F6">F6</button>
      <button class="key-fkey" data-key="F7">F7</button>
      <button class="key-fkey" data-key="F8">F8</button>
      <button class="key-fkey" data-key="F9">F9</button>
      <button class="key-fkey" data-key="F10">F10</button>
      <button class="key-fkey" data-key="F11">F11</button>
      <button class="key-fkey" data-key="F12">F12</button>
    </div>

    <div class="row">
      <button data-key="`" data-shift="~">`</button>
      <button data-key="1" data-shift="!">1</button>
      <button data-key="2" data-shift="@">2</button>
      <button data-key="3" data-shift="#">3</button>
      <button data-key="4" data-shift="$">4</button>
      <button data-key="5" data-shift="%">5</button>
      <button data-key="6" data-shift="^">6</button>
      <button data-key="7" data-shift="&amp;">7</button>
      <button data-key="8" data-shift="*">8</button>
      <button data-key="9" data-shift="(">9</button>
      <button data-key="0" data-shift=")">0</button>
      <button data-key="-" data-shift="_">-</button>
      <button data-key="=" data-shift="+">=</button>
      <button class="key-backspace" data-key="Backspace">⌫</button>
    </div>

    <div class="row">
      <button class="key-tab" data-key="Tab">Tab</button>
      <button data-key="q">Q</button>
      <button data-key="w">W</button>
      <button data-key="e">E</button>
      <button data-key="r">R</button>
      <button data-key="t">T</button>
      <button data-key="y">Y</button>
      <button data-key="u">U</button>
      <button data-key="i">I</button>
      <button data-key="o">O</button>
      <button data-key="p">P</button>
      <button data-key="[" data-shift="{">[</button>
      <button data-key="]" data-shift="}">]</button>
      <button class="key-backslash" data-key="\" data-shift="|">\</button>
    </div>

    <div class="row">
      <button class="key-caps" data-key="CapsLock">Caps</button>
      <button data-key="a">A</button>
      <button data-key="s">S</button>
      <button data-key="d">D</button>
      <button data-key="f">F</button>
      <button data-key="g">G</button>
      <button data-key="h">H</button>
      <button data-key="j">J</button>
      <button data-key="k">K</button>
      <button data-key="l">L</button>
      <button data-key="ç">Ç</button>
      <button data-key=";" data-shift=":">;</button>
      <button data-key="'" data-shift='"'>'</button>
      <button class="key-enter" data-key="Enter">Enter ↵</button>
    </div>

    <div class="row">
      <button class="key-shift-l" data-key="ShiftLeft">Shift ⇧</button>
      <button data-key="z">Z</button>
      <button data-key="x">X</button>
      <button data-key="c">C</button>
      <button data-key="v">V</button>
      <button data-key="b">B</button>
      <button data-key="n">N</button>
      <button data-key="m">M</button>
      <button data-key="," data-shift="&lt;">,</button>
      <button data-key="." data-shift="&gt;">.</button>
      <button data-key="/" data-shift="?">/</button>
      <button class="key-shift-r" data-key="ShiftRight">⇧ Shift</button>
    </div>

    <div class="row row-bottom">
      <button class="key-ctrl" data-key="Control">Ctrl</button>
      <button class="key-win" data-key="Meta">⊞</button>
      <button class="key-alt" data-key="Alt">Alt</button>
      <button class="key-space" data-key=" ">Space</button>
      <button class="key-alt" data-key="AltRight">Alt</button>
      <button class="key-fn">Fn</button>
      <button class="key-ctrl" data-key="ControlRight">Ctrl</button>
    </div>

  </div>

  <footer>Lucio Henrique</footer>

  <script src="script.js"></script>

</body>
</html>
